<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Weather App</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    input {
      width: 80%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      text-align: center;
      margin-bottom: 10px;
    }

    button {
      width: 80%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(90deg, #43e97b, #38f9d7);
      transform: scale(1.05);
    }

    #output {
      margin-top: 25px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 20px;
      transition: 0.3s ease;
    }

    #output h3 {
      margin: 10px 0;
      font-size: 22px;
    }

    #output p {
      margin: 6px 0;
      font-size: 16px;
    }

    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto;
    }

    footer {
      margin-top: 15px;
      font-size: 13px;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌤️ Modern Weather App</h2>
    <input type="text" id="city" placeholder="Enter City Name"><br>
    <button id="getByCity">Get Weather</button>
    <button id="useLocation">Use My Location</button>
    <div id="output"></div>
    <footer>Powered by OpenWeatherMap</footer>
  </div>

  <script>
    const API_KEY = '02a2a15a189f0e587b78c004641c95c2';

    document.getElementById('getByCity').addEventListener('click', () => {
      const city = document.getElementById('city').value;
      if (city) {
        getWeatherByCity(city);
      } else {
        document.getElementById('output').innerHTML = '<p>Please enter a city name.</p>';
      }
    });

    document.getElementById('useLocation').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          getWeatherByCoords(lat, lon);
        }, () => {
          document.getElementById('output').innerHTML = '<p>Unable to get location.</p>';
        });
      } else {
        document.getElementById('output').innerHTML = '<p>Geolocation not supported.</p>';
      }
    });

    async function getWeatherByCity(city) {
      document.getElementById('output').innerHTML = '<p>Loading...</p>';
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        showWeather(data);
      } catch (error) {
        document.getElementById('output').innerHTML = '<p>Error fetching weather data.</p>';
      }
    }

    async function getWeatherByCoords(lat, lon) {
      document.getElementById('output').innerHTML = '<p>Loading...</p>';
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        showWeather(data);
      } catch (error) {
        document.getElementById('output').innerHTML = '<p>Error fetching weather data.</p>';
      }
    }

    function showWeather(data) {
      if (data.main) {
        const tempC = (data.main.temp - 273.15).toFixed(1);
        const weather = data.weather[0].description;
        const city = data.name;
        const country = data.sys.country;
        const humidity = data.main.humidity;
        const wind = data.wind.speed;
        const icon = data.weather[0].icon;

        document.getElementById('output').innerHTML = `
          <div class="icon">
            <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="Weather Icon">
          </div>
          <h3>${city}, ${country}</h3>
          <p><strong>Temperature:</strong> ${tempC} °C</p>
          <p><strong>Condition:</strong> ${weather}</p>
          <p><strong>Humidity:</strong> ${humidity}%</p>
          <p><strong>Wind Speed:</strong> ${wind} m/s</p>
        `;
      } else {
        document.getElementById('output').innerHTML = '<p>Could not find weather data.</p>';
      }
    }
  </script>
</body>
</html>
